name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.source }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - {source: crypto, package: book_crypto, cli: book-crypto-data}
          - {source: stock, package: book_stock, cli: book-stock-data}
          - {source: fx, package: book_fx, cli: book-fx-data}
          - {source: defi, package: book_defi, cli: book-defi-data}
    defaults:
      run:
        working-directory: sources/${{ matrix.source }}
    env:
      FREE_ONLY: "true"
      ALLOW_PAID_PROVIDERS: "false"
      ALLOW_EXTERNAL_WRITES: "false"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: sources/${{ matrix.source }}/pyproject.toml
      - name: Install package with the pinned shared lake runtime
        run: python -m pip install -e ".[lake]" pytest ruff
      - name: Check shared lake runtime is importable
        run: python -c "import data_lake.product_adapter, data_lake.silver"
      - name: Lint
        run: ruff check .
      # The [lake] extra installs solo-empire-data-lake, so Bronze/Silver lake
      # tests run here instead of skipping; -rs keeps any remaining skips visible.
      - name: Tests (standalone, including lake integration)
        run: python -m pytest -q -rs
      - run: python -m compileall -q src
      - run: python -m ${{ matrix.package }}.ingest --help
      - run: ${{ matrix.cli }} --help
