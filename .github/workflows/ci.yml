# CI + security baseline (DevSecOps Phase 1). Public repository: GitHub-hosted runners.
# Replaces the previous per-source matrix CI; every check it ran is kept in the commands below.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  crypto:
    uses: bookchaowalit/platform-ci-workflows/.github/workflows/ci-python.yml@c37ef9d113eefb3ed45429717cb7ca201192c3fc # v1.0.1
    with:
      working-directory: sources/crypto
      python-version: "3.12"
      # The [lake] extra installs the pinned shared lake runtime, so the Bronze/Silver lake
      # tests run instead of skipping.
      install-command: uv pip install -e ".[lake]" "pytest==9.1.1"
      # Free-only guard flags as in the old CI; -rs keeps any remaining skips visible.
      test-command: >-
        python -c "import data_lake.product_adapter, data_lake.silver" &&
        FREE_ONLY=true ALLOW_PAID_PROVIDERS=false ALLOW_EXTERNAL_WRITES=false python -m pytest -q -rs &&
        python -m compileall -q src &&
        python -m book_crypto.ingest --help &&
        book-crypto-data --help

  stock:
