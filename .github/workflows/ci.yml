# CI + security baseline (DevSecOps Phase 1). Public repository: GitHub-hosted runners.
# Each source under sources/ is its own package with its own uv.lock; one matrix entry per
# source and Python version runs the shared Python workflow in that directory.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source:
    strategy:
      fail-fast: false
      matrix:
        # Lowest supported (requires-python >=3.11) and a current release.
        python-version: ["3.11", "3.13"]
        source: [crypto, stock, fx, defi]
        # Ratchet (ADR-0004: threshold = measured total, rounded down, lowest of 3.11/3.13;
        # measured 2026-10-22). Raise as tests grow; the 80% floor is an open follow-up.
        include:
          - source: crypto
            package: book_crypto
            cli: book-crypto-data
            coverage: "78"
          - source: stock
            package: book_stock
            cli: book-stock-data
            coverage: "79"
          - source: fx
            package: book_fx
            cli: book-fx-data
            coverage: "77"
          - source: defi
            package: book_defi
            cli: book-defi-data
            coverage: "76"
    uses: bookchaowalit/platform-ci-workflows/.github/workflows/ci-python.yml@87dc5e1c7e0416886a6371d5a101bb2ccba38edd # v1.1.1
    with:
      working-directory: sources/${{ matrix.source }}
      python-version: ${{ matrix.python-version }}
      # Installs from the source's uv.lock (uv sync --frozen --all-extras): the lake extra with the
      # pinned data-lake-core commit, so the Bronze/Silver lake tests run instead of skipping, and
      # the dev extra (pytest, pytest-cov, ruff, mypy).
      coverage-threshold: ${{ matrix.coverage }}
      # Free-only guard flags as before; -rs keeps any remaining skips visible. No network.
      test-command: |
        python -c "import data_lake.product_adapter, data_lake.silver"
        FREE_ONLY=true ALLOW_PAID_PROVIDERS=false ALLOW_EXTERNAL_WRITES=false python -m pytest -q -rs --cov
        python -m compileall -q src
        python -m ${{ matrix.package }}.ingest --help > /dev/null
        ${{ matrix.cli }} --help > /dev/null

  security:
    uses: bookchaowalit/platform-ci-workflows/.github/workflows/security.yml@87dc5e1c7e0416886a6371d5a101bb2ccba38edd # v1.1.1
