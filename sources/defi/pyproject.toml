[project]
name = "book-defi-data"
version = "0.1.0"
description = "DeFi yield data ingestion and CLI from DefiLlama."
requires-python = ">=3.11"
dependencies = ["httpx>=0.27"]

[project.scripts]
book-defi-data = "book_defi.ingest:main"
